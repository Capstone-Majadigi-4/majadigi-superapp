services:
  postgres-db:
    image: postgres:15-alpine
    container_name: majadigi-postgres
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - majadigi-network

  redis-cache:
    image: redis:7-alpine
    container_name: majadigi-redis
    restart: always
    volumes:
      - redisdata:/data
    networks:
      - majadigi-network

  minio:
    image: minio/minio:latest
    container_name: majadigi-minio
    restart: always
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    networks:
      - majadigi-network

  nginx-proxy:
    image: nginx:alpine
    container_name: majadigi-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
    networks:
      - majadigi-network

  gateway:
    image: ${DOCKERHUB_USERNAME}/majadigi-gateway:${IMAGE_TAG:-latest}
    container_name: majadigi-gateway
    restart: always
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - majadigi-network

  auth-service:
    image: ${DOCKERHUB_USERNAME}/majadigi-auth-service:${IMAGE_TAG:-latest}
    container_name: majadigi-auth
    restart: always
    env_file: .env
    ports:
      - "3001:3001"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - majadigi-network

  transjatim-service:
    image: ${DOCKERHUB_USERNAME}/majadigi-transjatim-service:${IMAGE_TAG:-latest}
    container_name: majadigi-transjatim
    restart: always
    env_file: .env
    ports:
      - "3011:3011"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - majadigi-network

  bapok-service:
    image: ${DOCKERHUB_USERNAME}/majadigi-bapok-service:${IMAGE_TAG:-latest}
    container_name: majadigi-bapok
    restart: always
    env_file: .env
    ports:
      - "3003:3003"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - majadigi-network

  islamic-service:
    image: ${DOCKERHUB_USERNAME}/majadigi-islamic-service:${IMAGE_TAG:-latest}
    container_name: majadigi-islamic
    restart: always
    env_file: .env
    ports:
      - "3004:3004"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - majadigi-network

  rsud-service:
    image: ${DOCKERHUB_USERNAME}/majadigi-rsud-service:${IMAGE_TAG:-latest}
    container_name: majadigi-rsud
    restart: always
    env_file: .env
    ports:
      - "3005:3005"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - majadigi-network

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  majadigi-network:
    driver: bridge
