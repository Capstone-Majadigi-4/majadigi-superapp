version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: majadigi-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # mount file init.sql agar skema otomatis terbuat saat pertama kali jalan
      #- ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - majadigi-network

  redis-cache:
    image: redis:7-alpine
    container_name: majadigi-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - majadigi-network

volumes:
  pgdata:
  redisdata:

networks:
  majadigi-network:
    driver: bridge