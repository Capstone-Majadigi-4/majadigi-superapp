version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: majadigi-postgres
    restart: always
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - majadigi-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: majadigi-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@majadigi.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    networks:
      - majadigi-network
      
  redis-cache:
    image: redis:7-alpine
    container_name: majadigi-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - majadigi-network

volumes:
  pgdata:
  redisdata:

networks:
  majadigi-network:
    driver: bridge