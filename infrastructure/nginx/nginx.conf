worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    server {
        listen 80;
        server_name localhost;

        location /api/v1/ {
            # 1. Gunakan DNS bawaan Docker (127.0.0.11) untuk mencari nama kontainer
            resolver 127.0.0.11 valid=30s;
            
            # 2. Simpan nama kontainer ke dalam variabel (Trik Dynamic Resolution)
            set $upstream_gateway gateway;
            
            # 3. Gunakan variabel tersebut di proxy_pass
            proxy_pass http://$upstream_gateway:3000;
            
            # Header standar untuk meneruskan identitas klien            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
            proxy_send_timeout 5s;
        }

        location / {
            return 404;
        }
    }
}