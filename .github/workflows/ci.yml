name: CI
 
on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
 
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
 
      - name: Install dependencies
        run: npm ci
 
      - name: Run tests
        run: npm test
        
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=GANTI_DENGAN_PROJECT_KEY_BOS
            -Dsonar.sources=.
            -Dsonar.exclusions=node_modules/**,coverage/**