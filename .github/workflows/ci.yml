name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: |
            apps/gateway/pnpm-lock.yaml
            apps/auth-service/pnpm-lock.yaml
            apps/transjatim-service/pnpm-lock.yaml

      - name: Install gateway dependencies
        working-directory: apps/gateway
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install auth-service dependencies
        working-directory: apps/auth-service
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install transjatim-service dependencies
        working-directory: apps/transjatim-service
        run: pnpm install --frozen-lockfile --ignore-scripts

     
      - name: Test gateway
        working-directory: apps/gateway
        run: pnpm test --passWithNoTests

      - name: Test auth-service
        working-directory: apps/auth-service
        run: pnpm test --passWithNoTests

      - name: Test transjatim-service
        working-directory: apps/transjatim-service
        run: pnpm test --passWithNoTests

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=capstone-majadigi-4
            -Dsonar.projectKey=Capstone-Majadigi-4_majadigi-superapp
            -Dsonar.sources=apps
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

  docker-build-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    # Hanya jalan saat push ke dev, bukan saat PR
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            context: apps/gateway
            image: majadigi-gateway
          - service: auth-service
            context: apps/auth-service
            image: majadigi-auth-service
          - service: transjatim-service
            context: apps/transjatim-service
            image: majadigi-transjatim-service
         
          - service: bapok-service
            context: apps/bapok-service
            image: majadigi-bapok-service
          - service: islamic-service
            context: apps/islamic-service
            image: majadigi-islamic-service
          - service: rsud-service
            context: apps/rsud-service
            image: majadigi-rsud-service

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}