name: CD — Deploy to Production

on:
    workflow_run:
        workflows: ["CI"]
    push:
        branches:
        - chore/setup-infra
    pull_request:
        branches:
        - main
        types:
        - closed

jobs:
  guard:
    name: Check merged
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR merged — starting deployment"

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    needs: guard
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Generate image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            context: apps/gateway
            image: majadigi-gateway
          - service: auth-service
            context: apps/auth-service
            image: majadigi-auth-service
          - service: transjatim-service
            context: apps/transjatim-service
            image: majadigi-transjatim-service
          - service: bapok-service
            context: apps/bapok-service
            image: majadigi-bapok-service
          - service: islamic-service
            context: apps/islamic-service
            image: majadigi-islamic-service
          - service: rsud-service
            context: apps/rsud-service
            image: majadigi-rsud-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ needs.prepare.outputs.image_tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-and-push
    env:
      TAG: ${{ needs.prepare.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Save current stable tag
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/majadigi/infrastructure
            grep IMAGE_TAG .env 2>/dev/null | cut -d= -f2 > .last_stable_tag || echo "latest" > .last_stable_tag
            echo "Saved stable tag: $(cat .last_stable_tag)"

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: TAG
          script: |
            set -e
            cd /opt/majadigi/infrastructure

            # Update image tag di .env
            sed -i "s/IMAGE_TAG=.*/IMAGE_TAG=$TAG/" .env || echo "IMAGE_TAG=$TAG" >> .env

            # Pull image terbaru dari Docker Hub
            docker compose -f docker-compose.prod.yml pull

            # Jalankan semua service
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Bersihkan image lama
            docker image prune -f

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo "Waiting for services..."
            for i in $(seq 1 12); do
              if curl -sf --max-time 5 http://localhost/health; then
                echo "Health check passed on attempt $i"
                exit 0
              fi
              echo "Attempt $i/12 failed, retrying in 10s..."
              sleep 10
            done
            echo "Health check failed"
            exit 1

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/majadigi/infrastructure
            PREV_TAG=$(cat .last_stable_tag 2>/dev/null || echo "latest")
            echo "Rolling back to: $PREV_TAG"
            sed -i "s/IMAGE_TAG=.*/IMAGE_TAG=$PREV_TAG/" .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            echo "Rollback complete"